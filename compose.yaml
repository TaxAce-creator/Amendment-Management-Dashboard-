services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: taxace_amendments
      POSTGRES_USER: taxace
      POSTGRES_PASSWORD: taxace_local_change_me
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - taxace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxace -d taxace_amendments"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: taxace-local
      MINIO_ROOT_PASSWORD: taxace_local_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - taxace_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 taxace-local taxace_local_change_me; do sleep 2; done; mc mb --ignore-existing local/taxace-amendments; mc anonymous set none local/taxace-amendments;"

volumes:
  taxace_postgres_data:
  taxace_minio_data:
