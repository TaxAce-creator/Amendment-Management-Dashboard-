name: Standalone CI

on:
  push:
    branches:
      - main
      - "phase3-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taxace_amendments
          POSTGRES_USER: taxace
          POSTGRES_PASSWORD: taxace_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taxace -d taxace_amendments"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://taxace:taxace_ci_password@127.0.0.1:5432/taxace_amendments
      TEST_DATABASE_URL: postgres://taxace:taxace_ci_password@127.0.0.1:5432/taxace_amendments
      DATABASE_SSL: "false"
      AUTH_ALLOWED_DOMAIN: taxacebsi.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Standalone boundary audit
        run: pnpm standalone:audit

      - name: TypeScript check
        run: pnpm check

      - name: Unit and contract tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Apply standalone database migrations
