name: Standalone CI

on:
  push:
    branches:
      - main
      - "phase3-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: taxace_amendments
          MYSQL_USER: taxace
          MYSQL_PASSWORD: taxace_ci_password
          MYSQL_ROOT_PASSWORD: taxace_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptaxace_ci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://taxace:taxace_ci_password@127.0.0.1:3306/taxace_amendments
      TEST_DATABASE_URL: mysql://taxace:taxace_ci_password@127.0.0.1:3306/taxace_amendments
      DATABASE_SSL: "false"
      AUTH_ALLOWED_DOMAIN: taxacebsi.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Standalone boundary audit
        run: pnpm standalone:audit

      - name: TypeScript check
        run: pnpm check

      - name: Unit and contract tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Allow append-only trigger creation in CI MySQL
        run: |
          MYSQL_CONTAINER=$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -n 1)
          test -n "$MYSQL_CONTAINER"
          docker exec "$MYSQL_CONTAINER" mysql -uroot -ptaxace_ci_root_password -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Apply standalone database migrations
        run: pnpm db:migrate

      - name: Seed static reference data
        run: pnpm db:seed

      - name: Build production container
        run: docker build -t taxace-amendment-management:ci .
